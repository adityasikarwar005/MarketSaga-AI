[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "marketsage"
version = "0.1.0"
description = "Global event-driven real-time market prediction and options trading intelligence"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # M60 only. 5 000 paths of 60 steps is 443 ms in pure Python against a 60 ms
    # budget; vectorised it is 49 ms. Every other model here stays dependency-free.
    "numpy>=1.26",
    "tzdata>=2024.1",       # Windows has no system tz database
]

[project.optional-dependencies]
# Installed once Docker / the data spine comes online (Sprint 2+).
infra = [
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "msgpack>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pandas>=2.2",       # DuckDB .df() and the research layer
]
# The surface layer. Separate from `infra` because the API can run against a
# machine with no database - a dashboard that cannot start when Postgres is down
# is a dashboard that is absent exactly when someone is trying to find out why.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",           # the test client, and the only way to exercise the ASGI app
    "msgpack>=1.0",          # live-channel framing
]
# The Angel One SmartAPI adapter. Separate because libs/ms_data/angelone.py
# imports both lazily: the repository, the tests and CI all run without a broker
# account, and the mutation tests for the adapter run without one too.
broker = [
    # Angel One
    "smartapi-python>=1.4",
    # smartapi-python imports logzero and does not declare it, so pip will not
    # bring it in. Without this line the package installs cleanly and every
    # import of it raises ModuleNotFoundError at the first login attempt.
    "logzero>=1.7",
    "pyotp>=2.9",          # the daily TOTP; the secret lives in .env, never here
    # Upstox. The V3 feed is protobuf, and the generated module ships in the SDK
    # rather than being built here - vendoring a .proto means a protoc in the
    # build, and the schema is the vendor's to change.
    "upstox-python-sdk>=2.15",
    "protobuf>=5.26",
    "websocket-client>=1.7",
]
# Publishing the dashboard as a Hugging Face Space. Separate from everything
# else because deploying is not part of building, and nothing in libs/ imports it.
deploy = [
    "huggingface_hub>=0.24",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Pinned exactly, not floored. A floating lower bound is right for a library
    # this project imports and wrong for a tool that decides whether the build
    # passes: CI installs into a clean runner and resolves to whatever shipped
    # most recently, while a working copy keeps whatever it has. On 2026-08-30
    # that gap was one patch version of ruff - 0.16.4 locally, 0.16.5 on CI -
    # and it turned a green `tasks.py verify` into a red pipeline nineteen
    # seconds later, on a rule that had nothing to do with the change.
    #
    # ruff and black also appear in .pre-commit-config.yaml. The three copies
    # are checked against each other by tests/unit/test_toolchain_pins.py, so
    # bumping one alone fails rather than drifting.
    "ruff==0.16.5",
    "black==26.5.1",
    "mypy==2.3.1",
    "types-PyYAML>=6.0",   # mypy needs these to check config.py; CI installs only [dev]
    "pre-commit>=3.7",
    # pre-commit runs detect-secrets in its own env, but regenerating
    # .secrets.baseline needs the CLI here. Without a baseline on disk the hook
    # does not scan - it exits with an argparse error, which reads as noise.
    "detect-secrets>=1.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["libs*", "services*", "jobs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "infra: requires Postgres/Redis to be running (docker compose up)",
    "slow: takes more than a few seconds",
    "manual: requires human judgement, not run in CI",
]
# A DeprecationWarning is an error, because the ones that matter here are our
# own and a warning nobody reads is a warning that becomes a break later.
#
# The exception is narrow on purpose: it names one alias, in a chain of imports
# none of which is ours. `fastapi.testclient` imports `starlette.testclient`,
# which still annotates against `anyio.abc.BlockingPortal`, which anyio has
# deprecated in favour of `anyio.from_thread.BlockingPortal`. Nothing in this
# repository can stop that import, and turning it into an error stopped the
# whole integration file from being *collected* - so the API tests did not fail,
# they silently did not run, and CI reported a collection error two libraries
# deep. Pinning anyio to silence a warning about starlette's annotations would
# be worse: it freezes a transitive dependency for a line of code we do not own.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # black handles line length

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
# jobs/ and tasks.py were outside this for a long time, and a real bug lived
# there the whole time: research_smoke.py passed `regimes.get(day)` - a
# `Regime | None` - into a parameter typed `Regime`, silently overriding its
# default and picking a baseline keyed on nothing. Nothing was checking.
files = ["libs", "jobs", "tasks.py"]
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true

# Scripts, not library code. Type errors still matter there - that is the whole
# reason for widening the scope above - but demanding a full annotation on every
# throwaway helper in a job script buys noise rather than safety.
[[tool.mypy.overrides]]
module = ["jobs.*", "tasks"]
disallow_untyped_defs = false

# Optional dependencies with no stubs. They are imported lazily and only used
# when the corresponding extra is installed, so a missing stub is expected.
[[tool.mypy.overrides]]
module = [
    "redis.*",
    "kiteconnect.*",
    "pandas.*",
    "duckdb.*",
    "pyarrow.*",
    "psycopg.*",
    "SmartApi.*",
    "pyotp.*",
    "upstox_client.*",
    "google.protobuf.*",
    "websocket.*",
    "huggingface_hub.*",
]
ignore_missing_imports = true
