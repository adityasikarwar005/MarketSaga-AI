<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live · MarketSage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Live session view.
 *
 * Shares the desk's palette so the two do not read as different products. It is
 * not the desk: the desk shows a decision, this shows what the recorder is
 * actually holding, which is a different question and mostly a data-quality one.
 *
 * The one rule that shaped the layout: nothing on this page may look current
 * when it is not. A stale value that still looks live is worse than a blank.
 */
:root {
  --bg:#0B0E11; --bg-2:#0E1216; --panel:#12171C; --panel-2:#171D23;
  --line:#232B33; --line-soft:#1A2128;
  --fg:#E6ECF2; --fg-dim:#93A0AD; --fg-faint:#626E7A;
  --accent:#C89B3C; --accent-2:#E4BC63; --accent-dim:#3A2E14;
  --pos:#4FA97C; --neg:#CC5B52; --warn:#C79245;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sans:"Archivo",-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:10px;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans);
       font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased; }
a { color:var(--accent-2); text-decoration:none; }
.wrap { max-width:1320px; margin:0 auto; padding:0 20px 64px; }

/* ── top bar ─────────────────────────────────────────────────────── */
.top { display:flex; align-items:center; gap:18px; flex-wrap:wrap;
       padding:14px 0; border-bottom:1px solid var(--line);
       position:sticky; top:0; background:var(--bg); z-index:10; }
.brand { font-weight:800; letter-spacing:.02em; color:var(--fg); }
.brand em { font-style:normal; color:var(--accent); }
.pill { font-family:var(--mono); font-size:11px; letter-spacing:.06em;
        text-transform:uppercase; padding:4px 10px; border-radius:100px;
        border:1px solid var(--line); color:var(--fg-dim); }
.pill.live { color:var(--pos); border-color:#20402F; background:#0E1A14; }
.pill.stale { color:var(--neg); border-color:#3A2020; background:#1A0F0F; }
.pill.dot::before { content:"●"; margin-right:6px; font-size:9px; vertical-align:1px; }
.spacer { flex:1; }
.clock { font-family:var(--mono); color:var(--fg-dim); font-size:12px; }

/* ── hero numbers ────────────────────────────────────────────────── */
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
         gap:10px; margin:20px 0; }
.tile { background:var(--panel); border:1px solid var(--line-soft);
        border-radius:var(--radius); padding:14px 16px; }
.tile .k { font-family:var(--mono); font-size:10px; letter-spacing:.09em;
           text-transform:uppercase; color:var(--fg-faint); }
.tile .v { font-family:var(--mono); font-size:26px; font-weight:600;
           margin-top:6px; letter-spacing:-.01em; }
.tile .s { font-size:11px; color:var(--fg-dim); margin-top:2px; }
.tile.hero .v { font-size:34px; color:var(--accent-2); }
.tile.bad .v { color:var(--neg); }

/* ── panels ──────────────────────────────────────────────────────── */
.grid { display:grid; grid-template-columns:1.25fr 1fr; gap:14px; align-items:start; }
@media (max-width:1040px) { .grid { grid-template-columns:1fr; } }
.panel { background:var(--panel); border:1px solid var(--line-soft);
         border-radius:var(--radius); overflow:hidden; }
.panel > h2 { margin:0; padding:12px 16px; font-size:12px; font-weight:600;
              letter-spacing:.06em; text-transform:uppercase; color:var(--fg-dim);
              border-bottom:1px solid var(--line-soft); background:var(--panel-2); }
.panel .body { padding:12px 16px 16px; }
.scroll { overflow-x:auto; }

/* ── ladder ──────────────────────────────────────────────────────── */
table { border-collapse:collapse; width:100%; font-family:var(--mono); font-size:12px; }
th { font-size:10px; letter-spacing:.07em; text-transform:uppercase;
     color:var(--fg-faint); font-weight:500; text-align:right; padding:8px 10px;
     border-bottom:1px solid var(--line); white-space:nowrap; }
td { padding:5px 10px; text-align:right; border-bottom:1px solid var(--line-soft);
     white-space:nowrap; color:var(--fg-dim); }
td.strike { text-align:center; color:var(--fg); font-weight:600; }
tr.atm td { background:var(--accent-dim); color:var(--fg); }
tr.atm td.strike { color:var(--accent-2); }
td.lit { color:var(--fg); }

/* ── features ────────────────────────────────────────────────────── */
.grp { margin-bottom:14px; }
.grp h3 { margin:0 0 6px; font-family:var(--mono); font-size:10px;
          letter-spacing:.09em; text-transform:uppercase; color:var(--fg-faint); }
.feat { display:flex; justify-content:space-between; gap:12px;
        font-family:var(--mono); font-size:12px; padding:3px 0;
        border-bottom:1px solid var(--line-soft); }
.feat .n { color:var(--fg-dim); }
.feat .v { color:var(--fg); }
.feat.null .v { color:var(--fg-faint); }

/* ── notes ───────────────────────────────────────────────────────── */
.note { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft);
        font-size:12px; color:var(--fg-dim); }
.note:last-child { border-bottom:0; }
.note .tag { font-family:var(--mono); font-size:10px; letter-spacing:.06em;
             text-transform:uppercase; color:var(--warn); flex:0 0 84px; }
.note .tag.ok { color:var(--pos); }
.note strong { color:var(--fg); font-weight:600; }
.err { color:var(--neg); font-family:var(--mono); font-size:12px; }
.muted { color:var(--fg-faint); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <span class="brand">MarketSage&nbsp;<em>Live</em></span>
    <span class="pill dot" id="status">connecting</span>
    <span class="pill" id="token">—</span>
    <span class="spacer"></span>
    <span class="clock" id="clock">—</span>
    <a href="index.html">overview</a>
    <a href="desk.html">desk</a>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="grid">
    <div class="panel">
      <h2>Front-expiry ladder <span id="ladderMeta" class="muted"></span></h2>
      <div class="scroll"><table id="ladder"></table></div>
    </div>

    <div>
      <div class="panel" style="margin-bottom:14px;">
        <h2>Feature vector</h2>
        <div class="body" id="features"><span class="muted">waiting…</span></div>
      </div>
      <div class="panel">
        <h2>Recording</h2>
        <div class="body" id="health"><span class="muted">waiting…</span></div>
      </div>
    </div>
  </div>

</div>

<script>
const GROUPS = { A:"A · price & trend", C:"C · options", D:"D · cross-asset", F:"F · calendar" };
const POLL_MS = 5000;

const fmt = (v, dp = 2) =>
  v === null || v === undefined ? "—" : Number(v).toLocaleString("en-IN",
    { minimumFractionDigits: dp, maximumFractionDigits: dp });
const pct = (v, dp = 2) => v === null || v === undefined ? "—" : (v * 100).toFixed(dp) + "%";

function tile(k, v, s, cls = "") {
  return `<div class="tile ${cls}"><div class="k">${k}</div>
          <div class="v">${v}</div><div class="s">${s || "&nbsp;"}</div></div>`;
}

function renderTiles(d) {
  const g = name => (d.features?.[name] || {}).value;
  const age = d.health?.chain_age_seconds;
  document.getElementById("tiles").innerHTML = [
    tile("NIFTY spot", fmt(d.spot), `snapshot ${d.chain?.ts?.slice(11,19) || "—"}`, "hero"),
    tile("ATM implied vol", pct(g("atm_iv")), `${g("days_to_expiry") ?? "—"} day(s) to expiry`),
    tile("Implied move", pct(g("implied_move_pct")), "front-expiry straddle / spot"),
    tile("Term slope", pct(g("iv_term_slope"), 3), "back minus front ATM"),
    tile("Put/call OI", fmt(g("put_call_oi_ratio"), 3), "front expiry"),
    tile("Chain age", age === undefined ? "—" : fmt(age, 0) + "s",
         "since the last snapshot", age > 60 ? "bad" : "")
  ].join("");
}

function renderLadder(d) {
  const rows = d.chain?.ladder || [];
  const meta = d.chain
    ? `· ${d.chain.strikes} strikes · ${d.chain.quotes} quotes · completeness ${pct(d.chain.completeness, 0)}`
    : "";
  document.getElementById("ladderMeta").textContent = meta;
  const head = `<thead><tr>
      <th>call OI</th><th>call IV</th><th>call bid</th><th>call ask</th>
      <th style="text-align:center">strike</th>
      <th>put bid</th><th>put ask</th><th>put IV</th><th>put OI</th>
    </tr></thead>`;
  const body = rows.map(r => {
    const c = r.call || {}, p = r.put || {};
    return `<tr class="${r.atm ? "atm" : ""}">
      <td>${c.oi === undefined || c.oi === null ? "—" : c.oi.toLocaleString("en-IN")}</td>
      <td>${pct(c.iv, 1)}</td>
      <td class="lit">${fmt(c.bid)}</td><td class="lit">${fmt(c.ask)}</td>
      <td class="strike">${fmt(r.strike, 0)}</td>
      <td class="lit">${fmt(p.bid)}</td><td class="lit">${fmt(p.ask)}</td>
      <td>${pct(p.iv, 1)}</td>
      <td>${p.oi === undefined || p.oi === null ? "—" : p.oi.toLocaleString("en-IN")}</td>
    </tr>`;
  }).join("");
  document.getElementById("ladder").innerHTML = head + "<tbody>" + body + "</tbody>";
}

function renderFeatures(d) {
  const byGroup = {};
  for (const [name, meta] of Object.entries(d.features || {})) {
    (byGroup[meta.group] ||= []).push([name, meta.value]);
  }
  const out = Object.keys(GROUPS).filter(g => byGroup[g]).map(g => {
    const items = byGroup[g].sort().map(([n, v]) =>
      `<div class="feat ${v === null ? "null" : ""}">
         <span class="n">${n}</span>
         <span class="v">${v === null ? "—" : Number(v).toPrecision(5)}</span>
       </div>`).join("");
    const live = byGroup[g].filter(([, v]) => v !== null).length;
    return `<div class="grp"><h3>${GROUPS[g]} — ${live}/${byGroup[g].length} live</h3>${items}</div>`;
  }).join("");
  document.getElementById("features").innerHTML = out || `<span class="muted">no features yet</span>`;
}

function renderHealth(d) {
  const h = d.health || {}, c = d.chain || {};
  const cf = h.candle_files || {};
  const notes = [];
  if (c.missing_iv) notes.push(["check", `<strong>${c.missing_iv}</strong> of ${c.quotes} quotes carry no implied vol — deep in- and out-of-the-money strikes where the solver has nothing to work with.`]);
  if (c.crossed) notes.push(["check", `<strong>${c.crossed}</strong> crossed quotes (bid above ask) in the latest snapshot.`]);
  if (!c.missing_book) notes.push(["ok", `Every quote carries a bid and an ask. This is what the bhavcopy archive cannot supply and why the session is worth recording.`]);
  if (cf.files && cf.empty === cf.files) notes.push(["durability", `All <strong>${cf.files}</strong> candle files are still zero bytes on disk. The fsync counter is per file, and a stream fanned across hundreds of them never reaches it; ticks are safe and candles are rebuildable from them.`]);
  else if (cf.files) notes.push(["ok", `${cf.files - cf.empty} of ${cf.files} candle files have reached the disk.`]);
  notes.push(["ids", `Records are stamped with Angel's token <strong>${d.token}</strong>, not the config id 1. Research jobs asked for instrument 1 will find this day empty.`]);

  document.getElementById("health").innerHTML = `
    <div class="feat"><span class="n">ticks in tail</span><span class="v">${(h.ticks_in_tail ?? 0).toLocaleString("en-IN")}</span></div>
    <div class="feat"><span class="n">candles rebuilt</span><span class="v">${(h.candles_built ?? 0).toLocaleString("en-IN")}</span></div>
    <div class="feat"><span class="n">snapshots in tail</span><span class="v">${(h.snapshots_in_tail ?? 0).toLocaleString("en-IN")}</span></div>
    <div class="feat"><span class="n">tick file</span><span class="v">${((h.tick_bytes ?? 0)/1048576).toFixed(1)} MB</span></div>
    <div class="feat"><span class="n">chain file</span><span class="v">${((h.chain_bytes ?? 0)/1048576).toFixed(1)} MB</span></div>
    <div style="margin-top:12px">${notes.map(([t, s]) =>
      `<div class="note"><span class="tag ${t === "ok" ? "ok" : ""}">${t}</span><span>${s}</span></div>`).join("")}</div>`;
}

async function poll() {
  const status = document.getElementById("status");
  try {
    const r = await fetch("/api/live", { cache: "no-store" });
    const d = await r.json();
    if (d.error) throw new Error(d.error);

    status.className = "pill dot " + (d.recording ? "live" : "stale");
    status.textContent = d.recording ? "recording" : "stale";
    document.getElementById("token").textContent = "token " + d.token;
    document.getElementById("clock").textContent = d.generated_at.slice(11, 19) + " IST";

    renderTiles(d); renderLadder(d); renderFeatures(d); renderHealth(d);
  } catch (e) {
    // Say so on the page. Leaving the last good numbers up while the feed is
    // gone is the failure this whole view exists to make visible.
    status.className = "pill dot stale";
    status.textContent = "endpoint error";
    document.getElementById("health").innerHTML = `<div class="err">${e.message}</div>`;
  }
}
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
