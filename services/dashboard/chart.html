<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option chain · MarketSage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* The chain is the spine of this page, and everything else answers to the row
 * you picked. Calls left, strikes down the centre, puts right - the way an
 * Indian options chain is actually read - because that is what makes four
 * hundred and fifty contracts navigable where a row of chips was not.
 *
 * One rule runs through the whole thing: what happened and what was forecast
 * never share a colour, a fill, or an array. Jade and crimson are the market's.
 * Violet is not a market colour on purpose - the forecast is a different kind
 * of object and is drawn from outside the palette of real prices.
 */
:root {
  --ink:#0B1418;
  --surface:#101E24;
  --raise:#16272F;
  --rule:#1D323B;
  --rule-soft:#152730;
  --text:#DBE9EE;
  --dim:#87A2AC;
  --faint:#57737D;
  --up:#17B98A;
  --down:#E14B4B;
  --fore:#8E7BF5;
  --fore-soft:rgba(142,123,245,.13);
  --atm:#E0B457;
  --sans:"Instrument Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
* { box-sizing:border-box; }
html,body { height:100%; }
body {
  margin:0; background:var(--ink); color:var(--text);
  font-family:var(--sans); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a { color:var(--text); text-decoration:none; border-bottom:1px solid var(--rule); }
a:hover { border-bottom-color:var(--dim); }
button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
:focus-visible { outline:2px solid var(--fore); outline-offset:2px; }

/* ---- frame ---------------------------------------------------------- */
.shell { display:flex; flex-direction:column; height:100vh; }

.bar {
  display:flex; align-items:center; gap:22px; padding:0 20px; height:56px;
  border-bottom:1px solid var(--rule); background:var(--surface); flex:none;
}
.mark { font-weight:600; letter-spacing:-.01em; font-size:15px; }
.mark span { color:var(--faint); font-weight:400; }
.switch { display:flex; gap:2px; background:var(--ink); padding:2px; border-radius:7px; }
.switch button {
  padding:5px 14px; border-radius:5px; font-size:12px; font-weight:500; color:var(--dim);
}
.switch button:hover { color:var(--text); }
.switch button[aria-pressed="true"] { background:var(--raise); color:var(--text); }

.readout { display:flex; gap:26px; margin-left:auto; align-items:baseline; }
.readout div { display:flex; flex-direction:column; gap:1px; }
.readout b { font:500 15px/1 var(--mono); font-feature-settings:"tnum"; letter-spacing:-.02em; }
.readout i { font-style:normal; font-size:11px; color:var(--faint); }
.nav { display:flex; gap:16px; font-size:12px; color:var(--dim); }

.body { display:flex; flex:1; min-height:0; }

/* ---- the ladder ------------------------------------------------------ */
.chain {
  width:328px; flex:none; border-right:1px solid var(--rule);
  display:flex; flex-direction:column; background:var(--surface); min-height:0;
}
.chain header {
  display:grid; grid-template-columns:1fr 78px 1fr; align-items:center;
  padding:12px 14px 9px; border-bottom:1px solid var(--rule-soft); flex:none;
}
.chain header b { font-weight:500; font-size:12px; color:var(--dim); }
.chain header b:last-child { text-align:right; }
.chain header span { text-align:center; font-size:11px; color:var(--faint); }
.rows { overflow-y:auto; overscroll-behavior:contain; flex:1; padding-bottom:12px; }
.rows::-webkit-scrollbar { width:9px; }
.rows::-webkit-scrollbar-thumb { background:var(--raise); border-radius:9px; }

.row {
  display:grid; grid-template-columns:1fr 78px 1fr; align-items:center; width:100%;
  padding:5px 14px; font:400 12px/1.35 var(--mono); font-feature-settings:"tnum";
  border-left:2px solid transparent; text-align:left;
}
.row:hover { background:var(--raise); }
.row[aria-current="true"] { background:var(--raise); border-left-color:var(--fore); }
.row .k { text-align:center; color:var(--dim); font-weight:500; }
.row .ce { color:var(--text); }
.row .pe { color:var(--text); text-align:right; }
.row .no { color:var(--faint); }
/* In the money: the side that already has intrinsic value, tinted so the
   money's position on the ladder is visible without reading a number. */
.row .itm { background:rgba(23,185,138,.07); }
.row.atm .k { color:var(--atm); }
.row.atm .k::after { content:"·"; margin-left:5px; color:var(--atm); }

/* ---- charts ---------------------------------------------------------- */
.stack { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
.pane { flex:1; display:flex; flex-direction:column; min-height:0; position:relative; }
.pane + .pane { border-top:1px solid var(--rule); }
.pane header {
  display:flex; align-items:baseline; gap:16px; padding:9px 18px; flex:none;
  border-bottom:1px solid var(--rule-soft);
}
.pane h2 { margin:0; font-size:13px; font-weight:600; letter-spacing:-.01em; }
.side { font-size:11px; font-weight:500; padding:2px 7px; border-radius:4px; }
.side.c { background:rgba(23,185,138,.14); color:var(--up); }
.side.p { background:rgba(225,75,75,.14); color:var(--down); }
.ohlc { display:flex; gap:14px; font:400 11.5px/1 var(--mono); color:var(--faint);
        font-feature-settings:"tnum"; }
.ohlc em { font-style:normal; color:var(--dim); }
.iv { margin-left:auto; font:400 11.5px/1 var(--mono); color:var(--faint); }
/* The canvas is taken out of the flex flow entirely. As a flex item it had an
   intrinsic aspect ratio, so setting width/height to redraw at device pixel
   density changed the layout, which fired resize, which redrew. The page froze.
   Absolutely positioned inside a sized box, it cannot influence its own size. */
.plot { position:relative; flex:1; min-height:0; cursor:crosshair; }
.plot canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
/* The crosshair is its own layer. Redrawing 375 candles on every mousemove was
   both wasteful and the thing that made the resize cycle expensive enough to
   hang; the price layer is now painted when the data or the box changes, and
   pointer movement clears and repaints only this. */
.plot canvas.over { pointer-events:none; }

/* ---- footer ---------------------------------------------------------- */
.foot {
  flex:none; border-top:1px solid var(--rule); background:var(--surface);
  padding:11px 20px; display:flex; gap:28px; align-items:center; flex-wrap:wrap;
}
.legend { display:flex; gap:16px; font-size:11.5px; color:var(--faint); align-items:center; }
.legend i { width:9px; height:12px; border-radius:2px; display:inline-block;
            margin-right:6px; vertical-align:-1px; }
.legend .u { background:var(--up); } .legend .d { background:var(--down); }
.legend .f { background:var(--fore-soft); border:1px dashed var(--fore); }
.score { margin-left:auto; font-size:11.5px; color:var(--dim); }
.score b { font-weight:500; color:var(--text); }
.score button { color:var(--fore); font-size:11.5px; margin-left:10px; }

dialog {
  border:1px solid var(--rule); background:var(--surface); color:var(--text);
  border-radius:12px; padding:0; max-width:640px; width:calc(100% - 40px);
}
dialog::backdrop { background:rgba(6,12,15,.7); }
dialog .in { padding:22px 24px 24px; }
dialog h3 { margin:0 0 12px; font-size:14px; font-weight:600; }
dialog p { margin:0 0 14px; color:var(--dim); max-width:66ch; }
table { border-collapse:collapse; font:400 12px/1.6 var(--mono); font-feature-settings:"tnum"; }
th { text-align:right; padding:0 18px 6px 0; font-weight:400; font-size:11px; color:var(--faint); }
td { text-align:right; padding:2px 18px 2px 0; color:var(--dim); }
td.win { color:var(--up); } td.lose { color:var(--down); }
dialog .close { margin-top:18px; color:var(--fore); font-size:12px; }

/* The expiry rail. The chain stays the spine of this page - this is the other
   axis it is read on, and it is a rail rather than a dropdown because NIFTY
   lists eighteen expiries and which ones are crowded is itself information:
   four weeklies in a row, then months, then a long tail nobody trades. A
   dropdown would have hidden that behind a click. */
.rail {
  display:flex; gap:6px; overflow-x:auto; padding:8px 18px;
  border-bottom:1px solid var(--rule); background:var(--raise);
  scrollbar-width:thin;
}
.rail button {
  flex:0 0 auto; display:flex; flex-direction:column; gap:1px; align-items:flex-start;
  padding:6px 11px; border-radius:7px; border:1px solid transparent;
  background:transparent; color:var(--faint); cursor:pointer; line-height:1.25;
  font:inherit; text-align:left;
}
.rail button b { font-size:12px; font-weight:600; color:var(--text); letter-spacing:.01em; }
.rail button i { font-style:normal; font-size:10.5px; font-family:var(--mono); }
.rail button:hover { background:var(--sink); }
.rail button[aria-selected="true"] {
  border-color:var(--rule); background:var(--sink); color:var(--text);
}
.rail button[aria-selected="true"] b { color:var(--fore); }
/* An expiry with no future behind it gets candles and no forecast. Marked on
   the rail rather than only in the footer, so the absence is visible before
   the payload is opened rather than after. */
.rail button.nofc b::after {
  content:"·"; margin-left:5px; color:var(--faint); font-weight:400;
}

@media (max-width:900px) {
  .body { flex-direction:column; }
  .chain { width:auto; max-height:36vh; border-right:none; border-bottom:1px solid var(--rule); }
  .readout { display:none; }
}
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="shell">

  <div class="bar">
    <span class="mark">MarketSage <span>chain</span></span>
    <div class="switch" id="switch"></div>
    <div class="readout">
      <div><b id="fwd">—</b><i id="fwdName">forward</i></div>
      <div><b id="expiry">—</b><i id="dte">expiry</i></div>
      <div><b id="count">—</b><i id="listed">contracts</i></div>
      <div><b id="day">—</b><i id="asOf">session</i></div>
    </div>
    <nav class="nav"><a href="index.html">Overview</a><a href="desk.html">Desk</a></nav>
  </div>

  <div class="rail" id="rail" role="tablist" aria-label="Expiry"></div>

  <div class="body">
    <section class="chain">
      <header><b>Calls</b><span id="strikeCount">strike</span><b>Puts</b></header>
      <div class="rows" id="rows"></div>
    </section>

    <div class="stack">
      <section class="pane">
        <header>
          <span class="side c">Call</span>
          <h2 id="ceName">—</h2>
          <div class="ohlc" id="ceOhlc"></div>
          <span class="iv" id="ceIv"></span>
        </header>
        <div class="plot" id="cePlot">
          <canvas id="ceChart"></canvas>
          <canvas id="ceOver" class="over"></canvas>
        </div>
      </section>
      <section class="pane">
        <header>
          <span class="side p">Put</span>
          <h2 id="peName">—</h2>
          <div class="ohlc" id="peOhlc"></div>
          <span class="iv" id="peIv"></span>
        </header>
        <div class="plot" id="pePlot">
          <canvas id="peChart"></canvas>
          <canvas id="peOver" class="over"></canvas>
        </div>
      </section>
    </div>
  </div>

  <div class="foot">
    <div class="legend">
      <span><i class="u"></i>Close above open</span>
      <span><i class="d"></i>Close below open</span>
      <span><i class="f"></i>Forecast, drawn over the hour it was made about</span>
    </div>
    <div class="score">
      <span id="verdict">—</span>
      <button id="openScore">How it was measured</button>
    </div>
  </div>
</div>

<dialog id="scoreBox"><div class="in">
  <h3>What the forecast is worth</h3>
  <p id="scoreText"></p>
  <table id="scoreTable"></table>
  <p id="scoreCaveat" style="margin-top:16px"></p>
  <button class="close" id="closeScore">Close</button>
</div></dialog>

<script src="chart_index.js"></script>
<script>
const IDX = window.CHART_INDEX;
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (n, d = 2) => n.toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });

// Two selections, not one. `under` is the index; `meta` is one of its expiries
// and is what everything on the page is actually about - its own money, its own
// strike grid, its own forward and its own score. Keeping the expiry in a
// variable called `meta` is deliberate: it is the unit this page draws.
let under = IDX.underlyings[0];
let meta = under.expiries[0];
let data = null;          // the loaded payload for `meta`
let strike = meta.atm;
const loaded = {};

// Clock time from a minute index. The bars carry an index rather than a string
// because four hundred contracts of "09:15" cost more than the prices did.
function clock(min, openHHMM) {
  const [h, m] = openHHMM.split(":").map(Number);
  const t = h * 60 + m + min;
  return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
}

// One payload per expiry, fetched when that expiry is opened and kept after.
// The index knows every rung of every expiry - counts, money, grid, score - so
// the rail and the header are right before anything is downloaded; what arrives
// on demand is the candles, which are all of the weight.
function load(e) {
  if (loaded[e.global]) return Promise.resolve(loaded[e.global]);
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = e.file;
    s.onload = () => {
      if (!window[e.global]) { reject(new Error(`${e.file} defined no ${e.global}`)); return; }
      loaded[e.global] = window[e.global];
      resolve(loaded[e.global]);
    };
    s.onerror = () => reject(new Error(`${e.file} did not load`));
    document.head.appendChild(s);
  });
}

const DAY_MS = 86400000;
const shortDate = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-IN",
  { day: "numeric", month: "short" });
const daysTo = iso =>
  Math.round((new Date(iso + "T00:00:00") - new Date(IDX.day + "T00:00:00")) / DAY_MS);

/* ---- the expiry rail ------------------------------------------------- */
function drawRail() {
  $("rail").innerHTML = under.expiries.map((e, i) => {
    const dte = daysTo(e.expiry);
    const cold = e.forward.basis === "carried" ? " nofc" : "";
    return `<button role="tab" class="${cold.trim()}" data-i="${i}"
      aria-selected="${e.expiry === meta.expiry}"
      title="${e.contracts} of ${e.listed} listed contracts traded; ${e.charted} have enough bars to chart${
        cold ? "; no listed future expires this late, so no forecast is drawn" : ""}">
      <b>${shortDate(e.expiry)}</b><i>${dte}d · ${e.contracts}</i></button>`;
  }).join("");
  for (const b of $("rail").querySelectorAll("button")) {
    b.onclick = () => openExpiry(under.expiries[Number(b.dataset.i)]);
  }
  const on = $("rail").querySelector('[aria-selected="true"]');
  if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
}

/* ---- the ladder ------------------------------------------------------ */
function ladder() {
  const by = new Map();
  for (const c of data.chain) {
    if (!by.has(c.strike)) by.set(c.strike, { strike: c.strike });
    by.get(c.strike)[c.right === "CE" ? "ce" : "pe"] = c;
  }
  return [...by.values()].sort((a, b) => a.strike - b.strike);
}

function drawLadder() {
  const rows = ladder();
  $("strikeCount").textContent = `${rows.length} strikes`;
  $("rows").innerHTML = rows.map(r => {
    // Each rung carries the minute it was read. The board is swept one
    // contract at a time at the endpoint's own pace, so two rungs are hours
    // apart on a bad day and the ladder should be able to say so when asked.
    const cell = (c, side) => c
      ? `<span class="${side}${c.chartable ? "" : " no"}" title="${
          c.bars} bars, last printed ${c.last_print}, read ${c.read_at || "—"}${
          c.chartable ? "" : "; too thin to chart"}"
        >${fmt(c.last)}</span>`
      : `<span class="${side} no" title="listed, no prints today">–</span>`;
    // A call is in the money below the forward, a put above it.
    const ceItm = r.strike < meta.forward.close ? " itm" : "";
    const peItm = r.strike > meta.forward.close ? " itm" : "";
    return `<button class="row${r.strike === meta.atm ? " atm" : ""}" data-k="${r.strike}"
      aria-current="${r.strike === strike}">
      <span class="ce${ceItm}">${cell(r.ce, "ce")}</span>
      <span class="k">${r.strike.toLocaleString("en-IN")}</span>
      <span class="pe${peItm}">${cell(r.pe, "pe")}</span>
    </button>`;
  }).join("");
  for (const b of $("rows").querySelectorAll(".row")) {
    b.onclick = () => { strike = Number(b.dataset.k); paint(); };
  }
}

function scrollToCurrent() {
  const el = $("rows").querySelector('[aria-current="true"]');
  if (el) el.scrollIntoView({ block: "center" });
}

/* ---- the chart ------------------------------------------------------- */
const VOL_LANE = 0.16;      // share of the plot given to volume
const PAD = { l: 10, r: 66, t: 12, b: 22 };

function seriesFor(right) {
  return data.series.find(s => s.strike === strike && s.right === right);
}

function fit(cv) {
  const r = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(cv.clientWidth * r));
  const h = Math.max(1, Math.round(cv.clientHeight * r));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  cv.getContext("2d").setTransform(r, 0, 0, r, 0, 0);
}

// Everything the crosshair layer needs, recomputed when the price layer is
// painted and stashed against the pane it belongs to.
const frames = new WeakMap();

function draw(cv, s) {
  fit(cv);
  const ctx = cv.getContext("2d");
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);
  if (!s) {
    ctx.fillStyle = css("--faint");
    ctx.font = `13px ${css("--sans")}`;
    ctx.fillText("This contract did not trade enough to chart.", 18, 30);
    frames.delete(cv);
    return;
  }

  const rec = s.recorded;
  const proj = s.projected || [];
  const first = rec[0][0], last = rec[rec.length - 1][0];
  const span = Math.max(1, last - first);
  const plotH = H - PAD.t - PAD.b;
  const priceH = plotH * (1 - VOL_LANE) - 6;
  const volTop = PAD.t + priceH + 6;
  const volH = plotH - priceH - 6;

  let lo = Infinity, hi = -Infinity, vMax = 0;
  for (const b of rec) { if (b[3] < lo) lo = b[3]; if (b[2] > hi) hi = b[2]; if (b[5] > vMax) vMax = b[5]; }
  for (const p of proj) { if (p[3] < lo) lo = p[3]; if (p[2] > hi) hi = p[2]; }
  const range = (hi - lo) || 1;
  const pad = range * 0.06;
  lo -= pad; hi += pad;

  const x = m => PAD.l + (W - PAD.l - PAD.r) * (m - first) / span;
  const y = v => PAD.t + priceH * (1 - (v - lo) / (hi - lo));
  const bw = Math.max(1, Math.min(9, (W - PAD.l - PAD.r) / (span + 1) * 0.72));

  // Grid: five price lines, labelled on the right where the eye already is.
  ctx.strokeStyle = css("--rule-soft"); ctx.lineWidth = 1;
  ctx.font = `11px ${css("--mono")}`; ctx.fillStyle = css("--faint");
  ctx.textAlign = "left";
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, yy = Math.round(y(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(PAD.l, yy); ctx.lineTo(W - PAD.r, yy); ctx.stroke();
    ctx.fillText(fmt(v, 1), W - PAD.r + 9, yy + 3.5);
  }

  // The forecast sits behind the record, as a band it cannot be mistaken for.
  if (proj.length) {
    const x0 = x(proj[0][0]) - bw;
    ctx.fillStyle = css("--fore-soft");
    ctx.beginPath();
    ctx.moveTo(x(proj[0][0]), y(proj[0][2]));
    for (const p of proj) ctx.lineTo(x(p[0]), y(p[2]));
    for (let i = proj.length - 1; i >= 0; i--) ctx.lineTo(x(proj[i][0]), y(proj[i][3]));
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = "rgba(142,123,245,.45)";
    ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, PAD.t); ctx.lineTo(x0, PAD.t + priceH); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "rgba(142,123,245,.85)";
    ctx.font = `11px ${css("--mono")}`;
    ctx.fillText(`forecast from ${s.anchor}`, x0 + 8, PAD.t + 12);
  }

  // Volume, quietly - it is context for the candles, not a second chart.
  for (const b of rec) {
    const h = vMax ? (b[5] / vMax) * volH : 0;
    ctx.fillStyle = b[4] >= b[1] ? "rgba(23,185,138,.32)" : "rgba(225,75,75,.32)";
    ctx.fillRect(x(b[0]) - bw / 2, volTop + volH - h, bw, h);
  }

  // What happened.
  for (const b of rec) {
    const up = b[4] >= b[1];
    const col = up ? css("--up") : css("--down");
    const cx = Math.round(x(b[0])) + (bw < 2 ? 0.5 : 0);
    ctx.strokeStyle = col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, y(b[2])); ctx.lineTo(cx, y(b[3])); ctx.stroke();
    const top = y(Math.max(b[1], b[4])), bot = y(Math.min(b[1], b[4]));
    ctx.fillStyle = col;
    ctx.fillRect(cx - bw / 2, top, bw, Math.max(1, bot - top));
  }

  // What was claimed: hollow, dashed, and wider than a minute bar so the two
  // are never one glance apart. Body is the interquartile range, because a
  // driftless forward's open and close are the same number to two decimals.
  // A bar a minute now, not eight coarsening steps, so these are the width of
  // a candle rather than three of them. Every third is drawn as a box; the rest
  // carry the band and the median line, because sixty dashed boxes in an hour
  // is a hatch pattern rather than a set of bars.
  const pw = Math.max(3, bw * 1.15);
  const anchorM = proj.length ? proj[0][0] : 0;
  for (const p of proj) {
    const cx = Math.round(x(p[0])) + 0.5;
    ctx.strokeStyle = css("--fore"); ctx.lineWidth = 1;
    ctx.setLineDash([3, 2]);
    ctx.beginPath(); ctx.moveTo(cx, y(p[2])); ctx.lineTo(cx, y(p[3])); ctx.stroke();
    ctx.setLineDash([]);
    // Filled, but at a quarter opacity and in a colour no traded price uses.
    // A dashed outline alone came out as a bare vertical line at these widths -
    // legibility and honesty are not in tension here, the colour carries it.
    const top = y(p[6]), h = Math.max(2, y(p[5]) - top);
    ctx.fillStyle = "rgba(142,123,245,.26)";
    ctx.fillRect(cx - pw / 2, top, pw, h);
    if ((p[0] - anchorM) % 5 === 0) {
      ctx.strokeStyle = css("--fore");
      ctx.setLineDash([3, 2]);
      ctx.strokeRect(cx - pw / 2, top, pw, h);
      ctx.setLineDash([]);
    }
    ctx.strokeStyle = css("--fore"); ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx - pw / 2, y(p[4])); ctx.lineTo(cx + pw / 2, y(p[4]));
    ctx.stroke();
  }

  // Time axis.
  ctx.fillStyle = css("--faint"); ctx.textAlign = "center";
  ctx.font = `11px ${css("--mono")}`;
  const every = Math.max(15, Math.ceil(span / 8 / 15) * 15);
  for (let m = Math.ceil(first / every) * every; m <= last; m += every) {
    // Clamped inside the plot: the 09:15 label sits at x=0 and rendered as
    // ":15" with its hour off the left edge of the canvas.
    ctx.fillText(clock(m, data.open), Math.min(Math.max(x(m), PAD.l + 18), W - PAD.r - 18), H - 7);
  }
  ctx.textAlign = "left";

  // Where it closed, carried across the plot. The one number a reader looks
  // for first, and the axis alone makes them measure it off a gridline.
  const lastC = rec[rec.length - 1][4];
  const ly = Math.round(y(lastC)) + 0.5;
  ctx.strokeStyle = "rgba(219,233,238,.25)"; ctx.setLineDash([1, 3]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD.l, ly); ctx.lineTo(W - PAD.r, ly); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = css("--raise");
  ctx.fillRect(W - PAD.r + 3, ly - 9, PAD.r - 6, 18);
  ctx.fillStyle = css("--text"); ctx.font = `500 11px ${css("--mono")}`;
  ctx.fillText(fmt(lastC, 1), W - PAD.r + 9, ly + 4);

  frames.set(cv, { rec, x, y, first, last, span, W, H, priceH, lo, hi });
}

function crosshair(price, over, px) {
  // Draws on the overlay only. Nothing here touches the price layer, so moving
  // the pointer costs a clear and a few lines rather than 375 candles.
  fit(over);
  const ctx = over.getContext("2d");
  const f = frames.get(price);
  ctx.clearRect(0, 0, over.clientWidth, over.clientHeight);
  if (!f) return null;

  const m = Math.round(f.first + (px - PAD.l) / (f.W - PAD.l - PAD.r) * f.span);
  let bar = null, best = Infinity;
  for (const b of f.rec) { const d = Math.abs(b[0] - m); if (d < best) { best = d; bar = b; } }
  if (!bar || best > 4) return null;

  const cx = Math.round(f.x(bar[0])) + 0.5;
  const yy = Math.round(f.y(bar[4])) + 0.5;
  ctx.strokeStyle = "rgba(219,233,238,.26)"; ctx.setLineDash([2, 3]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, PAD.t); ctx.lineTo(cx, PAD.t + f.priceH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PAD.l, yy); ctx.lineTo(f.W - PAD.r, yy); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = css("--fore");
  ctx.fillRect(f.W - PAD.r + 3, yy - 9, PAD.r - 6, 18);
  ctx.fillStyle = "#0B1418"; ctx.font = `500 11px ${css("--mono")}`;
  ctx.fillText(fmt(bar[4], 1), f.W - PAD.r + 9, yy + 4);
  return bar;
}

function clearCross(over) {
  fit(over);
  over.getContext("2d").clearRect(0, 0, over.clientWidth, over.clientHeight);
}

function readout(el, bar) {
  if (!bar) { el.textContent = ""; return; }
  const d = (k, v) => `<span><em>${k}</em> ${fmt(v)}</span>`;
  el.innerHTML = `<span>${clock(bar[0], data.open)}</span>`
    + d("O", bar[1]) + d("H", bar[2]) + d("L", bar[3]) + d("C", bar[4])
    + `<span><em>Vol</em> ${bar[5].toLocaleString("en-IN")}</span>`;
}

function wire(right, plotId, priceId, overId, out) {
  const plot = $(plotId), price = $(priceId), over = $(overId);
  plot.onmousemove = e => {
    const r = plot.getBoundingClientRect();
    readout($(out), crosshair(price, over, e.clientX - r.left));
  };
  plot.onmouseleave = () => {
    clearCross(over);
    lastBar($(out), seriesFor(right));
  };

  // A ResizeObserver rather than window.resize: the pane changes size when the
  // ladder wraps or a pane is added, neither of which resizes the window. The
  // last size is remembered so a repaint that does not change the box cannot
  // schedule another one - which is the loop that froze this page.
  let last = "";
  new ResizeObserver(entries => {
    const { width, height } = entries[0].contentRect;
    const key = `${Math.round(width)}x${Math.round(height)}`;
    if (key === last) return;
    last = key;
    requestAnimationFrame(() => {
      draw(price, seriesFor(right));
      clearCross(over);
    });
  }).observe(plot);
}

function lastBar(el, s) {
  readout(el, s && s.recorded.length ? s.recorded[s.recorded.length - 1] : null);
}

/* ---- painting -------------------------------------------------------- */
function paint() {
  for (const b of $("rows").querySelectorAll(".row")) {
    b.setAttribute("aria-current", String(Number(b.dataset.k) === strike));
  }
  for (const [right, name, cv, over, out, iv] of [
    ["CE", "ceName", "ceChart", "ceOver", "ceOhlc", "ceIv"],
    ["PE", "peName", "peChart", "peOver", "peOhlc", "peIv"],
  ]) {
    const s = seriesFor(right);
    $(name).textContent = `${strike.toLocaleString("en-IN")} ${right}`;
    $(iv).textContent = s && s.iv !== null ? `implied vol ${(s.iv * 100).toFixed(1)}%`
      : s ? "implied vol not invertible" : "";
    draw($(cv), s);
    clearCross($(over));
    lastBar($(out), s);
  }
}

function header() {
  const fwd = meta.forward;
  $("fwd").textContent = fwd.close === null ? "—" : fmt(fwd.close);
  $("fwdName").textContent = fwd.basis === "same-cycle"
    ? fwd.symbol
    : `${fwd.symbol} (${fwd.basis})`;
  $("expiry").textContent = shortDate(meta.expiry);
  const dte = daysTo(meta.expiry);
  $("dte").textContent = dte === 0 ? "expires today" : `${dte}d to expiry`;

  $("count").textContent = meta.contracts.toLocaleString("en-IN");
  $("listed").textContent = `of ${meta.listed} listed traded · ${meta.charted} charted`;

  $("day").textContent = new Date(IDX.day + "T00:00:00").toLocaleDateString("en-IN",
    { day: "numeric", month: "short" });
  // A window, not an instant. Every contract is its own request, so a board of
  // this size is read over hours and a single "as of" would be a claim about
  // rungs it was never true for.
  $("asOf").textContent = meta.read_from && meta.read_from !== meta.as_of
    ? `swept ${meta.read_from}–${meta.as_of}`
    : `read at ${meta.as_of || "—"}`;

  const sc = meta.score;
  const drawn = sc.horizons.length > 0;
  $("verdict").innerHTML = drawn
    ? `Forecast <b>${sc.verdict.split(" - ")[0]}</b>`
    : `<b>No forecast on this expiry</b> — ${sc.verdict.replace(/^not projected - /, "")}`;
  $("openScore").hidden = !drawn;
  if (!drawn) return;

  // Whether the forecast was anchored inside the session or at its live edge is
  // the difference between a claim a reader can check on this page and one they
  // cannot. It used to be asserted; it is now read off the data.
  const live = data && data.series.length
    ? data.series[0].anchor === clock(
        data.series[0].recorded[data.series[0].recorded.length - 1][0], data.open)
    : false;
  $("scoreText").textContent =
    `Each contract's implied volatility is inverted from its own price against the future's `
    + `price from the same minute — discounted to this expiry, since the future rarely shares `
    + `it — then the forward is diffused without drift, so the only thing genuinely forecast `
    + `is time decay. `
    + (live
        ? `The session is still running, so the forecast starts at the last minute recorded and `
          + `nothing has happened yet to check it against. `
        : `The session is over, so the forecast is anchored inside it and drawn over the hour `
          + `that actually followed. `)
    + `Measured against "${sc.baseline}" over every minute of ${sc.measured_on}, on this `
    + `expiry alone:`;
  $("scoreTable").innerHTML =
    "<tr><th>Horizon</th><th>n</th><th>Forecast MAE</th><th>Baseline MAE</th><th>Better by</th></tr>"
    + sc.horizons.map(h => {
        const d = -h.delta_pct;
        return `<tr><td>${h.minutes}m</td><td>${h.n.toLocaleString("en-IN")}</td>`
             + `<td>${h.model_mae.toFixed(3)}</td><td>${h.baseline_mae.toFixed(3)}</td>`
             + `<td class="${d < 0 ? "lose" : "win"}">${d.toFixed(2)}%</td></tr>`;
      }).join("");
  $("scoreCaveat").textContent = sc.caveat.charAt(0).toUpperCase() + sc.caveat.slice(1) + ".";
}

async function openExpiry(e) {
  meta = e;
  drawRail();
  data = await load(e);
  // No conversion pass over the series any more: the projection ships on the
  // same minute-since-open axis the recorded bars use.
  if (!data.chain.some(c => c.strike === strike)) strike = meta.atm;
  header();
  drawLadder();
  paint();
  scrollToCurrent();
}

async function showUnderlying(u) {
  under = u;
  strike = u.expiries[0].atm;
  await openExpiry(u.expiries[0]);
}

function init() {
  $("switch").innerHTML = IDX.underlyings.map((u, i) =>
    `<button data-i="${i}" aria-pressed="${i === 0}">${u.name}</button>`).join("");
  for (const b of $("switch").querySelectorAll("button")) {
    b.onclick = async () => {
      for (const o of $("switch").querySelectorAll("button")) {
        o.setAttribute("aria-pressed", String(o === b));
      }
      await showUnderlying(IDX.underlyings[Number(b.dataset.i)]);
    };
  }
  wire("CE", "cePlot", "ceChart", "ceOver", "ceOhlc");
  wire("PE", "pePlot", "peChart", "peOver", "peOhlc");
  $("openScore").onclick = () => $("scoreBox").showModal();
  $("closeScore").onclick = () => $("scoreBox").close();

  // No window.resize handler: each pane observes its own box, above.
  showUnderlying(under);
}
init();
</script>
</body>
</html>
