<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option chart · MarketSage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* One contract's minute candles, and what a projection says comes next.
 *
 * The whole design problem here is one thing: a projection drawn beside a price
 * series is indistinguishable from history the moment somebody screenshots it.
 * So the projected bars are hollow, sit behind a hatched panel, are separated by
 * a labelled divider, and carry the score the method actually earned. None of
 * that is decoration - it is the difference between a chart and a claim.
 */
:root {
  --bg:#0B0E11; --panel:#12171C; --panel-2:#171D23;
  --line:#232B33; --line-soft:#1A2128;
  --fg:#E6ECF2; --fg-dim:#93A0AD; --fg-faint:#626E7A;
  --accent:#C89B3C; --accent-2:#E4BC63; --accent-dim:#3A2E14;
  --up:#4FA97C; --down:#CC5B52; --warn:#C79245;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"Archivo",-apple-system,"Segoe UI",Roboto,sans-serif;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); font-size:13px; }
a { color:var(--accent-2); text-decoration:none; }
.wrap { max-width:1320px; margin:0 auto; padding:0 20px 60px; }

.top { display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:14px 0;
       border-bottom:1px solid var(--line); }
.brand { font-weight:800; } .brand em { font-style:normal; color:var(--accent); }
.spacer { flex:1; }
.meta { font-family:var(--mono); font-size:12px; color:var(--fg-dim); }

.controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:16px 0 10px; }
select, button { font-family:var(--mono); font-size:12px; background:var(--panel-2);
  color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
button[aria-pressed="true"] { background:var(--accent-dim); border-color:var(--accent);
  color:var(--accent-2); }
label { font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--fg-faint); margin-right:2px; }

.panel { background:var(--panel); border:1px solid var(--line-soft); border-radius:10px;
  overflow:hidden; }
.panel h2 { margin:0; padding:11px 16px; font-size:12px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--fg-dim); border-bottom:1px solid var(--line-soft);
  background:var(--panel-2); display:flex; gap:12px; align-items:baseline; }
.panel h2 .sub { font-family:var(--mono); font-size:11px; color:var(--fg-faint);
  text-transform:none; letter-spacing:0; }
#chart { display:block; width:100%; height:460px; }

.legend { display:flex; gap:20px; flex-wrap:wrap; padding:10px 16px;
  border-top:1px solid var(--line-soft); font-size:12px; color:var(--fg-dim); }
.key { display:inline-flex; align-items:center; gap:7px; }
.swatch { width:11px; height:15px; border-radius:2px; display:inline-block; }
.swatch.up { background:var(--up); } .swatch.down { background:var(--down); }
.swatch.proj { background:transparent; border:1.5px dashed var(--accent); }

.verdict { margin-top:14px; background:var(--panel); border:1px solid var(--line-soft);
  border-left:3px solid var(--warn); border-radius:10px; padding:14px 16px; }
.verdict h3 { margin:0 0 8px; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--warn); }
.verdict p { margin:0 0 10px; color:var(--fg-dim); line-height:1.6; }
table { border-collapse:collapse; font-family:var(--mono); font-size:12px; }
th { text-align:right; padding:5px 14px 5px 0; color:var(--fg-faint); font-weight:500;
  font-size:10px; letter-spacing:.07em; text-transform:uppercase; }
td { text-align:right; padding:3px 14px 3px 0; color:var(--fg-dim); }
td.bad { color:var(--down); }
.muted { color:var(--fg-faint); }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <span class="brand">MarketSage&nbsp;<em>Chart</em></span>
    <span class="meta" id="meta">—</span>
    <span class="spacer"></span>
    <a href="index.html">overview</a>
    <a href="desk.html">desk</a>
  </div>

  <div class="controls">
    <label for="strike">strike</label>
    <select id="strike"></select>
    <button id="ce" data-right="CE" aria-pressed="true">CE</button>
    <button id="pe" data-right="PE" aria-pressed="false">PE</button>
    <span class="spacer"></span>
    <span class="meta" id="last">—</span>
  </div>

  <div class="panel">
    <h2>Minute candles <span class="sub" id="title">—</span></h2>
    <canvas id="chart"></canvas>
    <div class="legend">
      <span class="key"><i class="swatch up"></i> recorded, close above open</span>
      <span class="key"><i class="swatch down"></i> recorded, close below open</span>
      <span class="key"><i class="swatch proj"></i> projected — hollow, hatched, and did not happen</span>
    </div>
  </div>

  <div class="verdict">
    <h3>What the projection is worth</h3>
    <p id="verdictText" class="muted"></p>
    <table id="scoreTable"></table>
  </div>

</div>

<script src="chart_data.js"></script>
<script>
const D = window.CHART;
const cv = document.getElementById("chart");
const ctx = cv.getContext("2d");
let right = "CE";
// Recorded bars shown. Enough for the shape of the session, few enough that the
// projection is legible beside them rather than crushed against the axis.
const WINDOW = 75;

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function strikes() {
  return [...new Set(D.series.map(s => s.strike))].sort((a, b) => a - b);
}
function current() {
  const k = Number(document.getElementById("strike").value);
  return D.series.find(s => s.strike === k && s.right === right);
}

function fit() {
  // Redraw at the device's pixel density; a canvas scaled by CSS alone renders
  // candles a pixel wide as a smear.
  const ratio = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * ratio;
  cv.height = cv.clientHeight * ratio;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
}

function draw() {
  const s = current();
  fit();
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);
  if (!s || !s.recorded.length) {
    ctx.fillStyle = css("--fg-faint"); ctx.font = "13px " + css("--sans");
    ctx.fillText("nothing recorded for this contract", 20, 30);
    return;
  }

  // A trailing window, not the whole session. With 184 recorded bars against
  // eight projected ones the projection was three percent of the width - the
  // part the chart exists to show, squeezed into the margin.
  const rec = s.recorded.slice(-WINDOW), proj = s.projected || [];
  const all = [...rec, ...proj];
  const pad = { l: 8, r: 66, t: 30, b: 26 };
  const lo = Math.min(...all.map(b => b.l)), hi = Math.max(...all.map(b => b.h));
  const span = (hi - lo) || 1;
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - (v - lo) / span);
  const n = all.length;
  const bw = Math.max(1.2, (W - pad.l - pad.r) / n * 0.68);
  const x = i => pad.l + (W - pad.l - pad.r) * (i + 0.5) / n;

  // The hatched panel behind everything projected. A reader who takes in only
  // the shape still sees that the right-hand side is a different kind of thing.
  if (proj.length) {
    const x0 = x(rec.length) - bw;
    ctx.save();
    ctx.fillStyle = "rgba(200,155,60,0.06)";
    ctx.fillRect(x0, pad.t, W - pad.r - x0, H - pad.t - pad.b);
    ctx.strokeStyle = "rgba(200,155,60,0.13)"; ctx.lineWidth = 1;
    for (let px = x0; px < W - pad.r; px += 9) {
      ctx.beginPath(); ctx.moveTo(px, H - pad.b); ctx.lineTo(px + 22, pad.t); ctx.stroke();
    }
    ctx.restore();

    ctx.strokeStyle = css("--accent"); ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, pad.t); ctx.lineTo(x0, H - pad.b); ctx.stroke();
    ctx.setLineDash([]);
    // Above the plot, right-aligned to the divider, so it cannot be clipped by
    // the price axis however narrow the projection is.
    ctx.fillStyle = css("--accent"); ctx.font = "10px " + css("--mono");
    ctx.textAlign = "right";
    ctx.fillText("PROJECTED — did not happen →", x0 - 8, 18);
    ctx.textAlign = "left";
  }

  // Price axis.
  ctx.font = "10px " + css("--mono"); ctx.fillStyle = css("--fg-faint");
  ctx.strokeStyle = css("--line-soft"); ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const v = lo + span * i / 4, yy = Math.round(y(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(W - pad.r, yy); ctx.stroke();
    ctx.fillText(v.toFixed(1), W - pad.r + 8, yy + 3);
  }

  all.forEach((b, i) => {
    const projected = i >= rec.length;
    const up = b.c >= b.o;
    const colour = projected ? css("--accent") : (up ? css("--up") : css("--down"));
    const cx = x(i);
    ctx.strokeStyle = colour; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, y(b.h)); ctx.lineTo(cx, y(b.l)); ctx.stroke();

    const top = y(Math.max(b.o, b.c)), bot = y(Math.min(b.o, b.c));
    const h = Math.max(1, bot - top);
    if (projected) {
      // Hollow, dashed. A filled projected candle is a lie with a light source.
      ctx.setLineDash([3, 2]);
      ctx.strokeRect(cx - bw / 2, top, bw, h);
      ctx.setLineDash([]);
    } else {
      ctx.fillStyle = colour;
      ctx.fillRect(cx - bw / 2, top, bw, h);
    }
  });

  // Time axis, thinned so labels never collide.
  ctx.fillStyle = css("--fg-faint");
  const every = Math.ceil(n / 10);
  all.forEach((b, i) => {
    if (i % every) return;
    ctx.fillText(b.t, x(i) - 14, H - pad.b + 15);
  });
}

function render() {
  const s = current();
  document.getElementById("title").textContent =
    s ? `${s.strike} ${s.right} · expiry ${D.expiry} · last ${Math.min(WINDOW, s.recorded.length)} of ${s.recorded.length} recorded, ${s.projected.length} projected`
      : "—";
  document.getElementById("last").textContent =
    s && s.recorded.length ? `last ${s.recorded[s.recorded.length - 1].c.toFixed(2)}` : "";
  draw();
}

function init() {
  document.getElementById("meta").textContent =
    `${D.day} · NIFTY ${D.spot.toLocaleString("en-IN")} · recorded to ${D.as_of} IST`;

  const sel = document.getElementById("strike");
  const atm = strikes().reduce((a, b) => Math.abs(b - D.spot) < Math.abs(a - D.spot) ? b : a);
  sel.innerHTML = strikes().map(k =>
    `<option value="${k}" ${k === atm ? "selected" : ""}>${k}${k === atm ? "  (ATM)" : ""}</option>`
  ).join("");
  sel.onchange = render;

  for (const id of ["ce", "pe"]) {
    document.getElementById(id).onclick = e => {
      right = e.currentTarget.dataset.right;
      document.getElementById("ce").setAttribute("aria-pressed", String(right === "CE"));
      document.getElementById("pe").setAttribute("aria-pressed", String(right === "PE"));
      render();
    };
  }

  const sc = D.score;
  document.getElementById("verdictText").innerHTML =
    `The projected candles hold the volatility surface fixed, let the clock run and let the ` +
    `forward diffuse without drift — so the only thing genuinely forecast is time decay. ` +
    `Measured on this same session against <strong>${sc.baseline}</strong>, it ` +
    `<strong>${sc.verdict}</strong>. The bars are drawn because you asked to see them, and ` +
    `they are drawn hollow because they did not happen.`;
  document.getElementById("scoreTable").innerHTML =
    "<tr><th>horizon</th><th>n</th><th>model MAE</th><th>baseline MAE</th><th>better by</th></tr>" +
    sc.horizons.map(h => {
      const d = 1 - h.model_mae / h.baseline_mae;
      return `<tr><td>${h.minutes}m</td><td>${h.n}</td><td>${h.model_mae.toFixed(3)}</td>` +
             `<td>${h.baseline_mae.toFixed(3)}</td>` +
             `<td class="${d < 0 ? "bad" : ""}">${(d * 100).toFixed(1)}%</td></tr>`;
    }).join("");

  render();
  window.addEventListener("resize", draw);
}
init();
</script>
</body>
</html>
