# M00 - pre-commit hooks.
#
# The secret scanner is the one that matters. A broker API key committed once is
# a key that must be rotated, and if it reaches a public remote it is a key that
# is already being used by someone else.
#
#   pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # `data/` is excluded from the two hooks that rewrite files. What lives
      # there is fetched market data and cached reference files, regenerated by
      # jobs rather than edited - so a hook that appends a newline to them
      # produces a diff on every refresh, and the diff says nothing.
      - id: trailing-whitespace
        exclude: "^data/"
      - id: end-of-file-fixer
        exclude: "^data/"
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2000"]   # market data belongs in data/, never in git
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # ruff and black are pinned to the exact versions the venv holds, and
  # `ruff-format` is gone.
  #
  # Two failures produced this. The config ran `ruff-format` while CLAUDE.md
  # names black as the formatter, and at v0.5.7 it rewrites PEP 695 generic
  # signatures into a shape nothing else here produces. And pre-commit pinned
  # black 24.8.0 against the venv's 26.5.1, so a file formatted by the hook
  # failed `tasks.py lint` and one formatted by `tasks.py fmt` failed the hook -
  # whichever ran last won.
  #
  # A `local` hook calling `.venv/Scripts/python.exe` was tried first and does
  # not work: pre-commit resolved that relative path against a different venv
  # entirely and reported "No module named ruff" from a Python this project
  # never installed. Pinned revs are the mechanism pre-commit actually provides.
  #
  # **These two revs must be bumped together with the venv.** They are the same
  # tools `tasks.py lint` runs, and the whole point is that they cannot drift
  # apart silently again.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # research/experiments.jsonl is excluded rather than baselined. It is a
        # hash chain: every appended trial adds a fresh 16-character hex digest,
        # which is a high-entropy string by construction and by design. Keeping
        # it baselined means regenerating the baseline on every experiment - and
        # a team in the habit of regenerating a secrets baseline to get a commit
        # through has a secrets baseline that catches nothing.
        #
        # What this gives up: the file is no longer scanned, so a credential
        # pasted into an Experiment's `notes` would not be caught here. It is
        # written only by ExperimentLog.record from structured fields, never by
        # hand, which is what makes that an acceptable trade rather than a
        # quiet one.
        exclude: '\.lock$|docs/pdf/|^research/experiments\.jsonl$'

  - repo: local
    hooks:
      # Rule R6: library code must never read the wall clock directly, or the
      # simulator and production stop sharing a code path.
      - id: no-wall-clock
        name: no wall-clock access outside clock.py
        entry: python -c "import sys,re,pathlib; bad=[f'{p}:{i}' for p in map(pathlib.Path,sys.argv[1:]) if p.name!='clock.py' for i,l in enumerate(p.read_text(encoding='utf-8').splitlines(),1) if re.search(r'datetime\\.now\\(|time\\.time\\(',l) and not l.strip().startswith('#')]; sys.exit('wall-clock access - inject a Clock instead:\\n  '+'\\n  '.join(bad)) if bad else None"
        language: system
        files: "^(libs|services)/.*\\.py$"

      # Rule R7: nothing may place a real order without an explicit live flag.
      - id: risk-limits-need-adr
        name: risk limit changes require an ADR
        entry: python -c "import sys,pathlib; adrs=list(pathlib.Path('docs/decisions').glob('ADR-*.md')); sys.exit('config/risk_limits.yaml changed - add an ADR in docs/decisions/ explaining why') if not adrs else None"
        language: system
        files: "^config/risk_limits\\.yaml$"
