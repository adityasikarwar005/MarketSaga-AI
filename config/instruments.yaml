# M10 - Instrument master
#
# WARNING: every entry below is `verified: false`.
# Lot sizes and tick sizes change by exchange circular, and using the wrong lot
# size silently multiplies your position. Before ANY sizing decision:
#   1. Pull the current contract specification from the exchange / your broker API
#   2. Add every historical lot-size change as its own `effective_from` entry
#   3. Cite the circular in `source`
#   4. Flip `verified: true`
#
# libs/ms_core/config.py warns on load while these are false, and the risk gate
# (M76) will refuse to size an unverified instrument.

