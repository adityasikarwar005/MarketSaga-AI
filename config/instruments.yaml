  - id: 11
    symbol: NIFTY-FUT
    name: Nifty 50 Futures (near month)
    kind: index_future
    exchange: NSE
    segment: FUT
    tick_size: 0.05
    verified: true
    notes: "Continuous near-month series. Basis vs spot is a feature (Group B).
      verified: true means the CURRENT contract spec is confirmed. The dated
      history below is confirmed for NIFTY because the same circular names 75 as
      the outgoing size."
    lot_sizes:
      - effective_from: 2020-01-01
        lot_size: 75
        source: "NSE circular NSE/FAOP/70616; corroborated by Angel One scrip master 2026-08-30 - names 75 as the size being revised, so it was in force until the change"
      - effective_from: 2025-12-31
        lot_size: 65
        source: "NSE circular NSE/FAOP/70616; corroborated by Angel One scrip master 2026-08-30"
      # The revision applies from the January 2026 series. Quarterly and
      # half-yearly contracts were revised at end of day 2025-12-30, which is
      # why the entry starts on the 31st; monthly contracts carried the old size
      # until their January expiry. A single date cannot express both, and the
      # earlier one is the safe direction: it prices a December monthly with the
      # new lot, which understates notional rather than overstating it.

  - id: 12
    symbol: BANKNIFTY-FUT
    name: Nifty Bank Futures (near month)
    kind: index_future
    exchange: NSE
    segment: FUT
    tick_size: 0.05
    verified: false
    notes: "Continuous near-month series. The CURRENT lot size is verified; the
      history is not, which is why this stays false. BANKNIFTY's lot has been
      revised several times and the 15 below is not sourced - do not price a
      pre-2026 BANKNIFTY trade from this file until each change has its own
