# M10 - Instrument master
#
# WARNING: most entries below are `verified: false`.
# NIFTY-FUT is verified (NSE/FAOP/70616, cross-checked against Angel's live
# scrip master). BANKNIFTY-FUT's CURRENT lot is sourced but its history is
# not, so it stays false - see its notes.
# Lot sizes and tick sizes change by exchange circular, and using the wrong lot
# size silently multiplies your position. Before ANY sizing decision:
#   1. Pull the current contract specification from the exchange / your broker API
#   2. Add every historical lot-size change as its own `effective_from` entry
#   3. Cite the circular in `source`
#   4. Flip `verified: true`
#
# libs/ms_core/config.py warns on load while these are false, and the risk gate
# (M76) will refuse to size an unverified instrument.

instruments:
  - id: 1
    symbol: NIFTY
    name: Nifty 50 Index
    kind: index
    exchange: NSE
    segment: CASH
    tick_size: 0.05
    expiry_weekday: 1  # Tue. NSE moved index weekly/monthly expiry off Thursday; every one of
                             # the 18 live NFO expiries in Angel's master (2026-08-30) is a
                             # Tuesday except two, and both are the Monday before a Tuesday
                             # holiday (2026-11-24, which config/sessions.yaml lists, and
                             # Christmas 2029). Consumers must still apply the holiday roll:
                             # this field is the nominal day, not the settled date.
    verified: false
    notes: "Spot index. Not directly tradable; underlying for FUT/OPT."
    lot_sizes: []              # index spot has no lot size

